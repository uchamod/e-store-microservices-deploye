# ------------------------
# User Service (With JWT Filter)
# ------------------------
spring.cloud.gateway.server.webflux.routes[1].id=USERS-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/user/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=JwtAuthenticationFilter

# ------------------------
# Product Service (With JWT Filter)
# ------------------------
spring.cloud.gateway.server.webflux.routes[2].id=PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=JwtAuthenticationFilter

logging.level.root=info
logging.level.org.springframework.cloud.gateway.server.webmvc=INFO
logging.level.org.springframework.cloud.gateway=trace
#logging.level.org.springframework.cloud.gateway=DEBUG

# ------------------------
# Cart Service (With JWT Filter)
# ------------------------
spring.cloud.gateway.server.webflux.routes[3].id=CART
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cart/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=JwtAuthenticationFilter

# ------------------------
# Order Service (With JWT Filter)
# ------------------------
spring.cloud.gateway.server.webflux.routes[4].id=ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/order/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=JwtAuthenticationFilter

# OAuth
spring.cloud.gateway.server.webflux.routes[5].id=USERS-SERVICE
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/oauth/**
# ========================
# Eureka Client Config
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

