spring.application.name=Cart
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://carts.chg2ekg2s786.ap-south-1.rds.amazonaws.com:5432/carts
spring.datasource.username=postgres
spring.datasource.password=Carts123#$
spring.jpa.hibernate.ddl-auto=update
server.port=8082

# SSL Configuration (Required for RDS)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# For AWS ECS (when deployed to ECS)
eureka.client.service-url.defaultZone=http://service-register.e-store.local:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# In application.properties
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
# Don't check database in health endpoint
management.health.db.enabled=false  
# Don't check Eureka in health endpoint
management.health.eureka.enabled=false  

